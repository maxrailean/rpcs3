      CCACHE_SHA: 859141059ac950e1e8cd042c66f842f26b9e3a62a1669a69fe6ba180cb58bbdf
      CCACHE_BIN_DIR: C:\ccache_bin
      CCACHE_DIR: C:\ccache
      CCACHE_INODECACHE: 'true'
      CCACHE_SLOPPINESS: time_macros
      CCACHE_MAXSIZE: 7G
      CCACHE_LAUNCH_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=C:\ccache_bin\ccache.exe -DCMAKE_CXX_COMPILER_LAUNCHER=C:\ccache_bin\ccache.exe
